version: "3.9"

x-unicall-labels:
  backend: &unicall-backend-labels
    unicall.app: unicall
    unicall.logging: "true"
  frontend: &unicall-frontend-labels
    unicall.app: unicall
    unicall.logging: "true"
  infrastructure: &unicall-infra-labels
    unicall.app: unicall
    unicall.logging: "true"
  observability: &unicall-observability-labels
    unicall.app: unicall
    unicall.logging: "true"

services:
  mysql:
    image: mysql:8.0
    container_name: unicall-mysql
    restart: unless-stopped
    labels:
      <<: *unicall-infra-labels
      unicall.service: mysql
    env_file:
      - ./Backend/.env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_USER: ${MYSQL_USER:-springstudent}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-springstudent}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  mongodb:
    image: mongo:7.0
    container_name: unicall-mongodb
    restart: unless-stopped
    labels:
      <<: *unicall-infra-labels
      unicall.service: mongodb
    env_file:
      - ./Backend/.env
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: unicall-rabbitmq
    restart: unless-stopped
    labels:
      <<: *unicall-infra-labels
      unicall.service: rabbitmq
    env_file:
      - ./Backend/.env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin123}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  redis:
    image: redis:7.4-alpine
    container_name: unicall-redis
    restart: unless-stopped
    labels:
      <<: *unicall-infra-labels
      unicall.service: redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  qdrant:
    image: qdrant/qdrant:v1.15.5
    container_name: unicall-qdrant
    restart: unless-stopped
    labels:
      <<: *unicall-infra-labels
      unicall.service: qdrant
    env_file:
      - ./Backend/.env
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  loki:
    image: grafana/loki:2.9.8
    container_name: unicall-loki
    restart: unless-stopped
    labels:
      <<: *unicall-observability-labels
      unicall.service: loki
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    mem_limit: 512m

  promtail:
    image: grafana/promtail:2.9.8
    container_name: unicall-promtail
    restart: unless-stopped
    labels:
      <<: *unicall-observability-labels
      unicall.service: promtail
    depends_on:
      - loki
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 128m

  grafana:
    image: grafana/grafana:10.4.3
    container_name: unicall-grafana
    restart: unless-stopped
    labels:
      <<: *unicall-observability-labels
      unicall.service: grafana
    depends_on:
      - loki
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    mem_limit: 384m

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    container_name: keycloak
    restart: unless-stopped
    labels:
      <<: *unicall-infra-labels
      unicall.service: keycloak
    env_file:
      - ./Backend/.env
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
    command: start-dev

  discovery-service:
    build:
      context: ./Backend
      dockerfile: ./discovery-service/Dockerfile
    container_name: unicall-discovery-service
    restart: unless-stopped
    labels:
      <<: *unicall-backend-labels
      unicall.service: discovery-service
    env_file:
      - ./Backend/.env
    ports:
      - "${DISCOVERY_SERVICE_PORT:-8761}:8761"

  api-gateway:
    build:
      context: ./Backend
      dockerfile: ./api-gateway/Dockerfile
    container_name: unicall-api-gateway
    restart: unless-stopped
    labels:
      <<: *unicall-backend-labels
      unicall.service: api-gateway
    env_file:
      - ./Backend/.env
    environment:
      REDIS_HOST: ${API_GATEWAY_REDIS_HOST:-redis}
      REDIS_PORT: ${API_GATEWAY_REDIS_PORT:-6379}
    depends_on:
      - discovery-service
      - keycloak
      - redis
    ports:
      - "${API_GATEWAY_PORT:-8088}:8088"

  user-service:
    build:
      context: ./Backend
      dockerfile: ./user-service/Dockerfile
    container_name: unicall-user-service
    restart: unless-stopped
    labels:
      <<: *unicall-backend-labels
      unicall.service: user-service
    env_file:
      - ./Backend/.env
    depends_on:
      - discovery-service
      - mysql
      - keycloak
    ports:
      - "${USER_SERVICE_PORT:-8081}:8081"
      - "${USER_SERVICE_GRPC_PORT:-9091}:9091"

  identity-service:
    build:
      context: ./Backend
      dockerfile: ./identity-service/Dockerfile
    container_name: unicall-identity-service
    restart: unless-stopped
    labels:
      <<: *unicall-backend-labels
      unicall.service: identity-service
    env_file:
      - ./Backend/.env
    depends_on:
      - discovery-service
      - keycloak
      - user-service
    ports:
      - "${IDENTITY_SERVICE_PORT:-8082}:8082"
      - "${IDENTITY_SERVICE_GRPC_PORT:-9092}:9092"

  file-service:
    build:
      context: ./Backend
      dockerfile: ./file-service/Dockerfile
    container_name: unicall-file-service
    restart: unless-stopped
    labels:
      <<: *unicall-backend-labels
      unicall.service: file-service
    env_file:
      - ./Backend/.env
    depends_on:
      - discovery-service
      - keycloak
    ports:
      - "${FILE_SERVICE_PORT:-8087}:8087"
      - "${FILE_SERVICE_GRPC_PORT:-9097}:9097"

  friend-service:
    build:
      context: ./Backend
      dockerfile: ./friend-service/Dockerfile
    container_name: unicall-friend-service
    restart: unless-stopped
    labels:
      <<: *unicall-backend-labels
      unicall.service: friend-service
    env_file:
      - ./Backend/.env
    depends_on:
      - discovery-service
      - mysql
      - keycloak
      - user-service
    ports:
      - "${FRIEND_SERVICE_PORT:-8084}:8084"
      - "${FRIEND_SERVICE_GRPC_PORT:-9098}:9098"

  notification-service:
    build:
      context: ./Backend
      dockerfile: ./notification-service/Dockerfile
    container_name: unicall-notification-service
    restart: unless-stopped
    labels:
      <<: *unicall-backend-labels
      unicall.service: notification-service
    env_file:
      - ./Backend/.env
    depends_on:
      - discovery-service
      - mysql
      - rabbitmq
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-8085}:8085"

  post-service:
    build:
      context: ./Backend
      dockerfile: ./post-service/Dockerfile
    container_name: unicall-post-service
    restart: unless-stopped
    labels:
      <<: *unicall-backend-labels
      unicall.service: post-service
    env_file:
      - ./Backend/.env
    depends_on:
      - discovery-service
      - mysql
      - user-service
      - file-service
    ports:
      - "${POST_SERVICE_PORT:-8089}:8089"
      - "${POST_SERVICE_GRPC_PORT:-9087}:9087"

  task-service:
    build:
      context: ./Backend
      dockerfile: ./task-service/Dockerfile
    container_name: unicall-task-service
    restart: unless-stopped
    labels:
      <<: *unicall-backend-labels
      unicall.service: task-service
    env_file:
      - ./Backend/.env
    depends_on:
      - discovery-service
      - mongodb
      - rabbitmq
    ports:
      - "${TASK_SERVICE_PORT:-8090}:8090"

  chat-service:
    build:
      context: ./Backend
      dockerfile: ./chat-service/Dockerfile
    container_name: unicall-chat-service
    restart: unless-stopped
    labels:
      <<: *unicall-backend-labels
      unicall.service: chat-service
    env_file:
      - ./Backend/.env
    environment:
      REDIS_HOST: ${CHAT_REDIS_HOST:-redis}
      REDIS_PORT: ${CHAT_REDIS_PORT:-6379}
    depends_on:
      - discovery-service
      - mongodb
      - rabbitmq
      - redis
      - qdrant
      - keycloak
      - user-service
      - friend-service
      - file-service
      - task-service
    ports:
      - "${CHAT_SERVICE_PORT:-8083}:8083"

  saga-orchestrator-service:
    build:
      context: ./Backend
      dockerfile: ./saga-orchestrator-service/Dockerfile
    container_name: unicall-saga-orchestrator-service
    restart: unless-stopped
    labels:
      <<: *unicall-backend-labels
      unicall.service: saga-orchestrator-service
    env_file:
      - ./Backend/.env
    depends_on:
      - discovery-service
    ports:
      - "${SAGA_ORCHESTRATOR_SERVICE_PORT:-8086}:8086"

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: unicall-frontend
    restart: unless-stopped
    labels:
      <<: *unicall-frontend-labels
      unicall.service: frontend
    depends_on:
      - api-gateway
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  mysql_data:
  mongodb_data:
  rabbitmq_data:
  redis_data:
  qdrant_data:
  keycloak_data:
  loki_data:
  grafana_data:
