spring:
  config:
    import: optional:file:../.env[.properties]
  application:
    name: chat-service
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin123}
  mongodb:
    uri: ${CHAT_MONGODB_URI:mongodb://localhost:27017/unicall_chat_service}

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

  data:
    mongodb:
      auto-index-creation: true
  ai:
    model:
      embedding:
        text: google-genai
    google:
      genai:
        embedding:
          api-key: ${AI_ASSISTANT_API_KEY:}
          text:
            options:
              model: gemini-embedding-001

server:
  port: ${CHAT_SERVICE_PORT:8083}

api:
  prefix: /api/v1

app:
  notification:
    exchange: ${NOTIFICATION_EXCHANGE:unicall.notification.exchange}
    routing-key-prefix: ${NOTIFICATION_ROUTING_KEY_PREFIX:notification.group}
  websocket:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:*}
  livekit:
    enabled: ${LIVEKIT_ENABLED:true}
    url: ${LIVEKIT_URL:ws://localhost:7880}
    api-key: ${LIVEKIT_API_KEY:devkey}
    api-secret: ${LIVEKIT_API_SECRET:secret}
    token-ttl-seconds: ${LIVEKIT_TOKEN_TTL_SECONDS:3600}
  ai-assistant:
    enabled: ${AI_ASSISTANT_ENABLED:true}
    base-url: ${AI_ASSISTANT_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    text-model: ${AI_ASSISTANT_TEXT_MODEL:gemini-2.5-pro}
    image-model: ${AI_ASSISTANT_IMAGE_MODEL:gemini-2.5-flash-image}
    api-key: ${AI_ASSISTANT_API_KEY:}
    text-system-prompt: ${AI_ASSISTANT_TEXT_SYSTEM_PROMPT:Bạn là UniCall AI, trả lời hữu ích, lịch sự bằng tiếng Việt.}
    image-system-prompt: ${AI_ASSISTANT_IMAGE_SYSTEM_PROMPT:Bạn là UniCallImage, tạo mô tả ảnh ngắn gọn bằng tiếng Việt.}
    connect-timeout-ms: ${AI_ASSISTANT_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${AI_ASSISTANT_READ_TIMEOUT_MS:30000}
    vector-search:
      enabled: ${AI_ASSISTANT_VECTOR_SEARCH_ENABLED:true}
      embedding-model: ${AI_ASSISTANT_EMBEDDING_MODEL:gemini-embedding-001}
      default-limit: ${AI_ASSISTANT_VECTOR_SEARCH_DEFAULT_LIMIT:12}
      max-limit: ${AI_ASSISTANT_VECTOR_SEARCH_MAX_LIMIT:50}
      min-content-length: ${AI_ASSISTANT_VECTOR_SEARCH_MIN_CONTENT_LENGTH:3}
      rabbitmq:
        exchange: ${AI_ASSISTANT_VECTOR_RABBIT_EXCHANGE:unicall.chat.ai.vector.exchange}
        queue: ${AI_ASSISTANT_VECTOR_RABBIT_QUEUE:unicall.chat.ai.vector.queue}
        routing-key: ${AI_ASSISTANT_VECTOR_RABBIT_ROUTING_KEY:chat.ai.vector.index}
      qdrant:
        base-url: ${AI_ASSISTANT_QDRANT_BASE_URL:http://localhost:6333}
        collection: ${AI_ASSISTANT_QDRANT_COLLECTION:unicall_chat_messages}
        api-key: ${AI_ASSISTANT_QDRANT_API_KEY:}
        timeout-ms: ${AI_ASSISTANT_QDRANT_TIMEOUT_MS:5000}
        auto-create-collection: ${AI_ASSISTANT_QDRANT_AUTO_CREATE_COLLECTION:true}
        vector-size: ${AI_ASSISTANT_QDRANT_VECTOR_SIZE:0}
        distance: ${AI_ASSISTANT_QDRANT_DISTANCE:Cosine}
    task-tools:
      base-url: ${AI_ASSISTANT_TASK_TOOLS_BASE_URL:http://localhost:8090/api/v1/tasks}
      connect-timeout-ms: ${AI_ASSISTANT_TASK_TOOLS_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${AI_ASSISTANT_TASK_TOOLS_READ_TIMEOUT_MS:8000}
      default-limit: ${AI_ASSISTANT_TASK_TOOLS_DEFAULT_LIMIT:20}
      max-limit: ${AI_ASSISTANT_TASK_TOOLS_MAX_LIMIT:100}
      default-due-soon-days: ${AI_ASSISTANT_TASK_TOOLS_DEFAULT_DUE_SOON_DAYS:3}

grpc:
  client:
    user-service:
      address: ${USER_SERVICE_GRPC_ADDRESS:static://localhost:9091}
      negotiationType: plaintext
    friend-service:
      address: ${FRIEND_SERVICE_GRPC_ADDRESS:static://localhost:9098}
      negotiationType: plaintext
    file-service:
      address: ${FILE_SERVICE_GRPC_ADDRESS:static://localhost:9097}
      negotiationType: plaintext
  user-service:
    deadline-ms: ${USER_SERVICE_GRPC_DEADLINE_MS:5000}
  friend-service:
    deadline-ms: ${FRIEND_SERVICE_GRPC_DEADLINE_MS:5000}
  file-service:
    deadline-ms: ${FILE_SERVICE_GRPC_DEADLINE_MS:10000}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.data.mongodb.core.MongoTemplate: DEBUG
    org.mongodb.driver.protocol.command: DEBUG
